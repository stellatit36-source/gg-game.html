<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Roblox Word Bomb</title>
    <style>
        body { 
            font-family: 'Gotham', 'Segoe UI', Arial, sans-serif; 
            background-color: #000000; 
            background-image: radial-gradient(circle, #1e222a 0%, #0d0f12 100%);
            color: #ffffff; 
            margin: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .game-container {
            background: #1b1d22; 
            padding: 40px; 
            border-radius: 16px; 
            border: 2px solid #393b43;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            width: 600px;
            position: relative;
        }

        .score-board {
            font-size: 24px;
            font-weight: 900;
            color: #00b06f;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .robux-icon {
            display: inline-block;
            background: #00b06f;
            color: #1b1d22;
            font-size: 18px;
            font-weight: 900;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 5px;
            transform: rotate(-10deg);
        }

        /* Визуализация бомбы и таймера */
        .bomb-zone {
            position: relative;
            margin: 20px auto;
            width: 150px;
            height: 150px;
        }

        .bomb {
            font-size: 100px;
            line-height: 150px;
            transition: transform 0.1s;
        }

        .bomb.ticking {
            animation: shake 0.5s infinite;
        }

        .bomb.exploding {
            animation: explode 0.5s forwards;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }

        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 2px 2px 4px #000;
        }

        .word-display {
            font-size: 42px;
            font-weight: 900;
            color: #1677ff;
            margin: 20px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .option-btn {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            background: #252831;
            color: #ffffff;
            border: 2px solid #393b43;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: #2e323e;
            border-color: #1677ff;
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: #00b06f;
            border-color: #00b06f;
            color: white;
        }

        .option-btn.wrong {
            background: #ff4d4f;
            border-color: #ff4d4f;
            color: white;
        }

        /* Экран Game Over */
        .game-over {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 15, 18, 0.95);
            border-radius: 16px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .game-over h2 {
            color: #ff4d4f;
            font-size: 48px;
            margin-bottom: 10px;
        }

        .btn-restart {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            background: #1677ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #0050b3;
            margin-top: 20px;
        }
        
        .btn-restart:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #0050b3;
        }

    </style>
</head>
<body>

<div class="game-container">
    <div class="score-board">
        Ваш баланс: <span class="robux-icon">R$</span> <span id="score">0</span>
    </div>

    <div class="bomb-zone">
        <div class="bomb ticking" id="bomb-icon">💣</div>
        <div class="timer-text" id="timer">10</div>
    </div>

    <div class="word-display" id="word">ADVANTAGE</div>

    <div class="options-grid" id="options-container">
        <!-- Сюда рендерятся кнопки с переводами -->
    </div>

    <!-- Экран проигрыша -->
    <div class="game-over" id="game-over-screen">
        <h2>💥 БУМ! Сервер упал!</h2>
        <p style="font-size: 20px;">Бомба взорвалась...</p>
        <p style="font-size: 24px; color: #00b06f; font-weight: bold;">Итоговый баланс: R$ <span id="final-score">0</span></p>
        <button class="btn-restart" onclick="startGame()">Играть снова</button>
    </div>
</div>

<script>
    const vocabulary = [
        { eng: "advantage", rus: "преимущество" },
        { eng: "cash", rus: "наличные" },
        { eng: "cheque", rus: "чек" },
        { eng: "demand", rus: "требовать" },
        { eng: "disorder", rus: "беспорядок" },
        { eng: "increase", rus: "возрастать" },
        { eng: "match", rus: "подходить (по стилю)" },
        { eng: "respect", rus: "уважать" },
        { eng: "role", rus: "роль" },
        { eng: "stock", rus: "ассортимент" },
        { eng: "act out", rus: "разыгрывать" },
        { eng: "go bad", rus: "портиться (о еде)" },
        { eng: "donate", rus: "жертвовать" },
        { eng: "famine", rus: "голод" },
        { eng: "goods", rus: "товары" },
        { eng: "helper", rus: "помощник" }
    ];

    let score = 0;
    let currentWord = null;
    let timerInterval = null;
    let timeLeft = 10;

    // Функция для перемешивания массива (чтобы ответы были в случайном порядке)
    function shuffleArray(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function startGame() {
        score = 0;
        document.getElementById("score").innerText = score;
        document.getElementById("game-over-screen").style.display = "none";
        document.getElementById("options-container").innerHTML = "";
        
        nextRound();
    }

    function nextRound() {
        // Сброс таймера
        clearInterval(timerInterval);
        timeLeft = 10;
        document.getElementById("timer").innerText = timeLeft;
        document.getElementById("bomb-icon").className = "bomb ticking";
        document.getElementById("bomb-icon").style.opacity = 1;
        
        // Выбираем случайное слово
        currentWord = vocabulary[Math.floor(Math.random() * vocabulary.length)];
        document.getElementById("word").innerText = currentWord.eng.toUpperCase();

        // Генерируем 4 варианта ответа (1 правильный и 3 случайных неправильных)
        let options = [currentWord.rus];
        
        // Набираем 3 неправильных перевода
        while(options.length < 4) {
            let randomWord = vocabulary[Math.floor(Math.random() * vocabulary.length)];
            if(!options.includes(randomWord.rus)) {
                options.push(randomWord.rus);
            }
        }

        // Перемешиваем варианты
        options = shuffleArray(options);

        // Рендерим кнопки
        const container = document.getElementById("options-container");
        container.innerHTML = "";
        options.forEach(option => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = option;
            btn.onclick = () => checkAnswer(option, btn);
            container.appendChild(btn);
        });

        // Запускаем таймер
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("timer").innerText = timeLeft;

            // Ускоряем анимацию бомбы к концу
            if(timeLeft <= 3) {
                document.getElementById("bomb-icon").style.animationDuration = "0.2s";
            } else {
                document.getElementById("bomb-icon").style.animationDuration = "0.5s";
            }

            if(timeLeft <= 0) {
                gameOver();
            }
        }, 1000);
    }

    function checkAnswer(selectedOption, btn) {
        // Останавливаем таймер при ответе
        clearInterval(timerInterval);

        // Блокируем все кнопки
        const allBtns = document.querySelectorAll(".option-btn");
        allBtns.forEach(b => b.disabled = true);

        if(selectedOption === currentWord.rus) {
            // Правильный ответ
            btn.classList.add("correct");
            score += 20; // Даем 20 R$ за правильный ответ
            document.getElementById("score").innerText = score;
            
            // Останавливаем бомбу (она "обезврежена")
            document.getElementById("bomb-icon").className = "bomb";
            
            // Даем время увидеть правильный ответ и запускаем следующее слово
            setTimeout(nextRound, 1000);
        } else {
            // Неправильный ответ
            btn.classList.add("wrong");
            // Показываем правильный ответ
            allBtns.forEach(b => {
                if(b.innerText === currentWord.rus) b.classList.add("correct");
            });
            
            // Взрыв бомбы
            setTimeout(gameOver, 1000);
        }
    }

    function gameOver() {
        clearInterval(timerInterval);
        document.getElementById("timer").innerText = "0";
        document.getElementById("bomb-icon").className = "bomb exploding";
        
        // Блокируем кнопки
        const allBtns = document.querySelectorAll(".option-btn");
        allBtns.forEach(b => b.disabled = true);

        // Показываем экран проигрыша
        document.getElementById("final-score").innerText = score;
        document.getElementById("game-over-screen").style.display = "flex";
    }

    // Запуск при загрузке
    startGame();
</script>

</body>
</html>
